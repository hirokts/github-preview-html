<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub HTML Preview</title>
    <link rel="stylesheet" href="preview.css">
  </head>
  <body>
    <header>
      <strong>GitHub HTML Preview</strong>
      <a id="source-link" target="_blank" rel="noreferrer">ソースを開く</a>
    </header>
    <main>
      <p id="status" role="status">HTML を読み込んでいます…</p>
      <iframe id="preview" title="HTML preview" sandbox="allow-forms allow-modals allow-popups allow-scripts"></iframe>
    </main>
    <script src="preview.js"></script>
  </body>
</html>
